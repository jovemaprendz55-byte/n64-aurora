name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.config.ts"
      - "modules/**"
      - "vendor/mupen64plus-ae/**"
      - "plugins/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project and native release configuration
        run: |
          pnpm check
          pnpm lint
          pnpm test
          pnpm audit:native

      - name: Build release APK
        run: pnpm release:android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-aurora-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
