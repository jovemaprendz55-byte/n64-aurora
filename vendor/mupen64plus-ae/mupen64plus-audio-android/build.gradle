apply plugin: 'com.android.library'
apply from: '../build_common/version_common.gradle'

android {
    namespace = "org.mupen64plusae.n64aurora.audio"

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        debug {
            minifyEnabled false
            jniDebuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'FULL'
            }
        }
        android {
        }
    }

    externalNativeBuild {
        cmake {
            version = "3.22.1"
            path "CMakeLists.txt"
        }
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID=1", "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_TOOLCHAIN=clang",
                        "-DANDROID_LIB_PATH=$projectDir/../ndkLibs",
                        "-DM64API_INCLUDE_PATH=$projectDir/../mupen64plus-core/upstream/src/api/",
                        "-DANDROID_STL=c++_shared"
                cppFlags "-fexceptions", "-ffast-math", "-ftree-vectorize", "-Oz", "-g"
                abiFilters "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
        }
    }

    buildFeatures {
        prefab = true
    }
    packagingOptions {
        jniLibs {
            // The audio plugin links SoundTouch at runtime; do not exclude the
            // arm64 shared libraries or dlopen(libmupen64plus-audio-android.so)
            // will fail on the device.
            useLegacyPackaging = true
        }
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.oboe:oboe:1.6.1'
}
